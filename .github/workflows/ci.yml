name: AgentShield CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff Check & Format
        run: |
          ruff check .
          ruff format --check .
        continue-on-error: true

  test-suite:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Configuration Validation
        run: |
          python scripts/validate_config.py --env local

      - name: Run Full Pytest Suite
        run: |
          pytest -v --tb=short tests/ -m "not live_openai"
        env:
          AGENTSHIELD_ENV: LOCAL
          AGENTSHIELD_JWT_SECRET: ci-test-secret-key-32-chars-long-minimum!
          AGENTSHIELD_DATABASE_URL: sqlite+aiosqlite:///:memory:
          PYTHONPATH: .

  security-checks:
    name: Security Regression & Red-Teaming
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pip-audit

      - name: Run Vulnerability Audit
        run: |
          pip-audit || true

      - name: Run Security Regression Suite
        run: |
          pytest -v tests/security/ tests/red_team/
        env:
          AGENTSHIELD_ENV: LOCAL
          AGENTSHIELD_JWT_SECRET: ci-test-secret-key-32-chars-long-minimum!
          AGENTSHIELD_DATABASE_URL: sqlite+aiosqlite:///:memory:
          PYTHONPATH: .
