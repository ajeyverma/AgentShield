name: Release Automation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  packages: write

jobs:
  build-and-package:
    name: Build & Package Artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow cyclonedx-bom

      - name: Generate Application Icons
        run: |
          python scripts/generate_icons.py

      - name: Build Desktop PyInstaller Bundle
        run: |
          python scripts/build_desktop.py --mode onedir

      - name: Package Windows Installer / Distribution Archive
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          cyclonedx-py requirements requirements.txt --output-format json --output-file dist/agentshield-sbom.json || echo "{}" > dist/agentshield-sbom.json

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/* -Include *.zip,*.exe,*.json | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding utf8
          }
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-release-artifacts
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/agentshield-sbom.json

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: agentshield-release-artifacts
          path: release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
