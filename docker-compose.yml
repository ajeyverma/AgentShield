# ==============================================================================
# AgentShield AI — Production Docker Compose Stack
# ==============================================================================

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: agentshield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction_StrongPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-agentshield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - agentshield-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentshield} -d ${POSTGRES_DB:-agentshield}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentshield-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AGENTSHIELD_ENV: remote
      AGENTSHIELD_HOST: 0.0.0.0
      AGENTSHIELD_PORT: 8000
      AGENTSHIELD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentshield}:${POSTGRES_PASSWORD:-ChangeMeInProduction_StrongPassword123!}@db:5432/${POSTGRES_DB:-agentshield}
      AGENTSHIELD_SECRET_KEY: ${AGENTSHIELD_SECRET_KEY:?Error: AGENTSHIELD_SECRET_KEY is required in production}
      AGENTSHIELD_LOG_LEVEL: ${AGENTSHIELD_LOG_LEVEL:-INFO}
      AGENTSHIELD_LOG_FORMAT: json
      AGENTSHIELD_CORS_ORIGINS: ${AGENTSHIELD_CORS_ORIGINS:-[]}
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - backend-logs:/app/logs
      - backend-data:/app/data
    networks:
      - agentshield-internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

volumes:
  pgdata:
    name: agentshield-pgdata
  backend-logs:
    name: agentshield-logs
  backend-data:
    name: agentshield-data

networks:
  agentshield-internal:
    name: agentshield-net
    driver: bridge
